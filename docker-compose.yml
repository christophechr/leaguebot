version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: leaguetalk-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leaguetalk
    ports:
      - "5432:5432"
    volumes:
      - leaguetalk_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leaguetalk"]
      interval: 5s
      timeout: 3s
      retries: 10
  bot:
    build: .
    container_name: leaguetalk-bot
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/leaguetalk
      PGSSL: "false"
    restart: unless-stopped

volumes:
  leaguetalk_pgdata:
